<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Usha Platform</title>
  <style>
    :root { --bg:#0a0a0b; --fg:#f5f5f5; --muted:#a1a1aa; --gold:#d4af37; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,"Segoe UI",sans-serif; }
    main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); gap:12px; }
    .mark { font-size:48px; font-weight:800; letter-spacing:-0.04em; color:var(--gold); margin-bottom:8px; }
    h1 { font-size:22px; margin:0; }
    p { margin:0; color:var(--muted); max-width:32ch; line-height:1.5; }
    button { margin-top:16px; appearance:none; border:0; border-radius:14px; padding:14px 28px; font-size:16px; font-weight:700; color:#000; background:linear-gradient(90deg,#e8d48b,#c8a445); }
    small { display:block; margin-top:24px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">U!</div>
    <h1>Ingen anslutning</h1>
    <p>Usha Platform behöver internet. Kontrollera uppkopplingen och försök igen.</p>
    <button type="button" onclick="location.replace('https://usha.se/app')">Försök igen</button>
    <small>No connection. Check your network and try again.</small>
  </main>
</body>
</html>
