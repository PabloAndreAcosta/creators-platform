name: Kontroll

# Typkontroll och tester på varje PR. Jobbet heter "kontroll" och krävs av
# branch protection på main — en PR med röda tester går inte att merga.
# (Bygget körs inte här: det behöver miljövariabler och tar flera minuter.
# Nya rutter ska byggas lokalt före merge, se docs/sakerhet/policyer/sakra-utveckling.md.)
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kontroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typkontroll
        run: npx tsc --noEmit -p .
      - name: Tester
        run: npx vitest run --reporter=dot
