name: Hourly cron jobs (reserv)

# RESERV. Den skarpa klockan är numera Cloudflare-workern usha-cron
# (workers/cron/), för att GitHubs schemaläggning är "best effort" på riktigt:
# uppmätt över en vecka gick den här listan i median var 4,5:e timme, med ett
# värsta glapp på 12,6. Påminnelsen "börjar snart" letar inom två timmar och
# missade därför 52 av 57 bokningar.
#
# Vercel Hobby tillåter bara en körning per dygn, så det här schemat får ligga
# kvar som andra ben. Endpointerna är idempotenta (varsin dedup-kolumn), så att
# båda pingar samma jobb skickar inte dubbla mejl.
on:
  schedule:
    - cron: "0 * * * *" # every hour, UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  ping:
    # Only run in the production org repo, not the private mirror.
    if: github.repository == 'usha-ab/creators-platform'
    runs-on: ubuntu-latest
    steps:
      - name: Booking "starts soon" reminders (T-2h)
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://usha.se/api/cron/booking-reminders-soon
      - name: Notify followers of new creator events
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://usha.se/api/cron/creator-event-notify
      - name: Auto-publish upcoming events to Facebook (T-3d)
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://usha.se/api/cron/event-reminders
      - name: Email waitlist when tickets are released
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://usha.se/api/cron/waitlist-release
      # Connect capabilities decide who is merchant of record at checkout, and
      # the account.updated webhook only fires on change — an account that was
      # already finished when the handler shipped never got one. This makes the
      # columns eventually right regardless of webhook delivery.
      - name: Re-sync Stripe Connect capabilities
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://usha.se/api/cron/connect-sync
