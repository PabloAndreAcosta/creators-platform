name: i18n consistency

# Fails a PR when a user could be shown the wrong language: the locale files
# (sv/en/es) drifting apart, a notification written with a message key that some
# language is missing, or an email template carrying hardcoded prose instead of
# a key. Each would put the wrong language — or a raw i18n key — in front of
# someone.
on:
  # Listed twice rather than shared through a YAML anchor — GitHub Actions does
  # not resolve anchors, and a silently-ignored trigger is how this job came to
  # never run in the first place.
  pull_request:
    paths:
      - "src/i18n/**"
      - "src/lib/notifications/**"
      - "src/lib/email/**"
      - "src/components/emails/**"
  push:
    branches: [main]
    paths:
      - "src/i18n/**"
      - "src/lib/notifications/**"
      - "src/lib/email/**"
      - "src/components/emails/**"
  workflow_dispatch: {}

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Not `npm ci`: the lockfile is generated on macOS and omits the Linux
      # side of some optional wasm packages (@emnapi/*), so `npm ci` fails its
      # own validation here — which is why this job never ran once since it was
      # added. Exact transitive binaries don't matter for a JSON key check.
      - run: npm install --no-audit --no-fund
      - name: Check locale parity, notification keys and email templates
        run: npx vitest run src/i18n src/lib/notifications src/lib/email
