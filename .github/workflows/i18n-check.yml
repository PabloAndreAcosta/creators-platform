name: i18n consistency

# Fails a PR when a user could be shown the wrong language: the locale files
# (sv/en/es) drifting apart, or a notification written with a message key that
# some language is missing. Both would put a raw i18n key in front of a user.
on:
  pull_request:
    paths:
      - "src/i18n/**"
      - "src/lib/notifications/**"
  push:
    branches: [main]
    paths:
      - "src/i18n/**"
      - "src/lib/notifications/**"
  workflow_dispatch: {}

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Not `npm ci`: the lockfile is generated on macOS and omits the Linux
      # side of some optional wasm packages (@emnapi/*), so `npm ci` fails its
      # own validation here — which is why this job never ran once since it was
      # added. Exact transitive binaries don't matter for a JSON key check.
      - run: npm install --no-audit --no-fund
      - name: Check locale key parity and notification keys
        run: npx vitest run src/i18n src/lib/notifications
